<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Tu compra · AZUL bendito</title><link rel="icon" href="/azul-favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><style>body{background:#f5f7f6;color:#192c52}.payment-page{min-height:100svh;display:grid;place-items:center;padding:28px 16px}.payment-card{background:#fffef9;border:1px solid #d4e4e5;padding:clamp(26px,6vw,58px);max-width:650px;width:100%;overflow-wrap:anywhere}.payment-card img{width:210px;max-width:100%;margin-bottom:35px}.payment-card h1{font-size:clamp(34px,6vw,48px);line-height:1.12;margin:16px 0}.payment-card p{line-height:1.7;margin:16px 0}.payment-actions{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}.payment-actions a,.payment-actions button{min-height:48px}.payment-actions .dark{background:#171176;color:#fff}.payment-card h1{font-family:Lora,Georgia,serif}.payment-card [hidden]{display:none!important}</style></head><body><main class="payment-page"><article class="payment-card"><a href="/" aria-label="Ir a AZUL bendito"><img src="/assets/azul-logo.webp" alt="AZUL bendito" onerror="this.hidden=true"></a><div class="eyebrow">TU COMPRA · AZUL BENDITO</div><div aria-live="polite"><h1 id="paymentTitle">Consultando tu pago…</h1><p id="paymentMessage">Estamos verificando el estado de tu compra.</p><p id="paymentSummary"></p></div><p id="paymentError" class="form-error" role="alert"></p><div class="payment-actions"><button class="button dark" id="checkPayment" type="button">Consultar estado</button><a class="button dark" id="resumePayment" hidden>Continuar en Mercado Pago ↗</a><a class="button" href="/">Volver a la
